name: Android debug APK

on:
  push:
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v5

      - name: Install CPython 3.13 for Chaquopy
        run: |
          uv python install 3.13
          echo "PYRUNNER_BUILD_PYTHON=$(uv python find 3.13)" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Check the APK contains the UI and the runner
        run: |
          apk=$(echo android/app/build/outputs/apk/debug/*.apk)
          unzip -l "$apk" | grep -q 'assets/web/index.html'
          unzip -l "$apk" | grep -q 'assets/packages.txt'
          unzip -p "$apk" assets/chaquopy/app.imy > /tmp/pyrunner-app.imy
          unzip -l /tmp/pyrunner-app.imy | grep -q 'pyrunner_rt/execute.pyc'

      - uses: actions/upload-artifact@v4
        with:
          name: pyrunner-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
