[project]
name = "pyrunner-host"
version = "0.1.4"
description = "Desktop host for PyRunner. Local only: no telemetry and no server on a public address."
requires-python = ">=3.12"
dependencies = [
  "pywebview>=5.3",
  "pip",
  "requests",
  "httpx",
  "beautifulsoup4",
  "lxml",
  "pandas",
  "numpy",
  "aiohttp",
  "python-dotenv",
  "tenacity",
  "tqdm",
]

[project.optional-dependencies]
browsers = [
  "playwright>=1.49",
  "selenium>=4.27",
]
packaging = [
  "pyinstaller>=6.11",
]

[project.scripts]
pyrunner = "pyrunner_host.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../runtime"]
